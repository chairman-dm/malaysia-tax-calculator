<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia Income Tax & Relief Calculator 2026</title>
    <meta name="description" content="Calculate your LHDN personal income tax, optimize tax reliefs, and estimate your tax payable for Malaysia easily.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- JSON-LD Structured Data for GEO & SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Malaysia Income Tax & Relief Calculator",
      "operatingSystem": "All",
      "applicationCategory": "FinanceApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "MYR"
      },
      "description": "Free web utility to calculate LHDN resident individual income tax and reliefs in Malaysia."
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-p-6">
    <div class="max-w-3xl mx-auto px-4 py-10">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">Malaysia Income Tax Calculator</h1>
            <p class="text-slate-600">Calculate your LHDN chargeable income and estimated tax payable instantly.</p>
        </header>

        <main class="bg-white shadow-sm ring-1 ring-slate-900/5 rounded-2xl p-6 sm:p-8 space-y-6">
            <!-- Income Inputs -->
            <div>
                <label for="annualIncome" class="block text-sm font-semibold text-slate-700 mb-1">Annual Gross Employment Income (RM)</label>
                <input type="number" id="annualIncome" placeholder="e.g. 70000" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
            </div>

            <!-- Relief Inputs -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="epfLife" class="block text-sm font-semibold text-slate-700 mb-1">EPF & Life Insurance (Max RM4,000)</label>
                    <input type="number" id="epfLife" placeholder="0" value="4000" class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
                </div>
                <div>
                    <label for="lifestyle" class="block text-sm font-semibold text-slate-700 mb-1">Lifestyle Relief (Max RM2,500)</label>
                    <input type="number" id="lifestyle" placeholder="0" class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
                </div>
                <div>
                    <label for="medical" class="block text-sm font-semibold text-slate-700 mb-1">Medical / Insurance (Max RM3,000)</label>
                    <input type="number" id="medical" placeholder="0" class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
                </div>
                <div>
                    <label for="socso" class="block text-sm font-semibold text-slate-700 mb-1">SOCSO / EIS (Max RM350)</label>
                    <input type="number" id="socso" placeholder="0" value="350" class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:ring-2 focus:ring-indigo-600 focus:outline-none">
                </div>
            </div>

            <button onclick="calculateTax()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition-colors cursor-pointer">
                Calculate Tax Payable
            </button>

            <!-- Results Section -->
            <div id="results" class="hidden mt-6 border-t border-slate-200 pt-6 space-y-4">
                <h2 class="text-xl font-semibold text-slate-900">Estimation Results</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <span class="block text-xs font-medium text-slate-500 uppercase">Chargeable Income</span>
                        <span id="resChargeable" class="text-xl font-bold text-slate-900">RM 0.00</span>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <span class="block text-xs font-medium text-slate-500 uppercase">Total Tax Payable</span>
                        <span id="resTax" class="text-xl font-bold text-indigo-600">RM 0.00</span>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <span class="block text-xs font-medium text-slate-500 uppercase">Effective Tax Rate</span>
                        <span id="resRate" class="text-xl font-bold text-slate-900">0.0%</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function calculateTax() {
            const income = parseFloat(document.getElementById('annualIncome').value) || 0;
            const epf = Math.min(parseFloat(document.getElementById('epfLife').value) || 0, 4000);
            const lifestyle = Math.min(parseFloat(document.getElementById('lifestyle').value) || 0, 2500);
            const medical = Math.min(parseFloat(document.getElementById('medical').value) || 0, 3000);
            const socso = Math.min(parseFloat(document.getElementById('socso').value) || 0, 350);

            // Automatic Individual Relief
            const automaticRelief = 9000;
            const totalReliefs = automaticRelief + epf + lifestyle + medical + socso;

            let chargeableIncome = Math.max(0, income - totalReliefs);
            let taxPayable = 0;

            // LHDN Progressive Tax Brackets Calculation
            const brackets = [
                { limit: 5000, rate: 0.00, base: 0 },
                { limit: 20000, rate: 0.01, base: 0 },
                { limit: 35000, rate: 0.03, base: 150 },
                { limit: 50000, rate: 0.06, base: 600 },
                { limit: 70000, rate: 0.11, base: 1500 },
                { limit: 100000, rate: 0.19, base: 3700 },
                { limit: 400000, rate: 0.25, base: 9400 },
                { limit: 600000, rate: 0.26, base: 84400 },
                { limit: 2000000, rate: 0.28, base: 136400 },
                { limit: Infinity, rate: 0.30, base: 528400 }
            ];

            let previousLimit = 0;
            for (let i = 0; i < brackets.length; i++) {
                let b = brackets[i];
                if (chargeableIncome <= b.limit) {
                    let excess = chargeableIncome - previousLimit;
                    if (excess < 0) excess = 0;
                    if (i === 0) {
                        taxPayable = 0;
                    } else if (i === 1) {
                        taxPayable = excess * b.rate;
                    } else {
                        // Use base cumulative tax from previous brackets plus rate on excess
                        let prevB = brackets[i-1];
                        taxPayable = prevB.base + (chargeableIncome - prevB.limit) * b.rate;
                    }
                    break;
                }
                previousLimit = b.limit;
            }

            // Tax rebate of RM400 if chargeable income <= 35000
            if (chargeableIncome <= 35000 && chargeableIncome > 0) {
                taxPayable = Math.max(0, taxPayable - 400);
            }

            let effectiveRate = income > 0 ? (taxPayable / income) * 100 : 0;

            // Render output
            document.getElementById('resChargeable').innerText = 'RM ' + chargeableIncome.toLocaleString('en-MY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resTax').innerText = 'RM ' + taxPayable.toLocaleString('en-MY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resRate').innerText = effectiveRate.toFixed(1) + '%';
            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
